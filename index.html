:root{--bg:#F2F5F3;--sf:#fff;--ink:#16262B;--mut:#5B6B70;--ln:#D8E0DC;--ac:#0F6B5C;--acf:#fff;--ok:#1E7A4A;--er:#B83A2A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1D;--sf:#17262A;--ink:#E7EFEC;--mut:#94A8AC;--ln:#2B3F44;--ac:#4DC2AB;--acf:#08201B;--ok:#6BD39A;--er:#F08A7A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A1D;--sf:#17262A;--ink:#E7EFEC;--mut:#94A8AC;--ln:#2B3F44;--ac:#4DC2AB;--acf:#08201B;--ok:#6BD39A;--er:#F08A7A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3,.ttl{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0 0 .6rem;line-height:1.2}
h2{font-size:1.4rem}h3{font-size:1.05rem}
#app{max-width:760px;margin:0 auto;padding:0 14px 28px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0}
header small{display:block;color:var(--mut)}
.ttl{font-size:1.25rem}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;border-bottom:1px solid var(--ln);margin-bottom:16px}
.tab{white-space:nowrap;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
.tab.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln)}
th{color:var(--mut);font-weight:600;font-size:.9rem}
.num{text-align:right}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px 10px;width:100%}
input.n{width:64px}
label{display:block;margin:12px 0;font-weight:600}
label input{margin-top:5px;font-weight:400}
.row{display:flex;gap:8px;margin-top:12px}
.row input{flex:1}.row select{width:auto}
button{font:inherit;cursor:pointer}
.pri{background:var(--ac);color:var(--acf);border:0;border-radius:8px;padding:10px 16px;font-weight:600}
.ghost{background:none;border:1px solid var(--ln);color:var(--ink);border-radius:8px;padding:8px 12px}
.tag{display:inline-block;border:1px solid var(--ln);border-radius:12px;padding:2px 10px;font-size:.88rem;background:var(--sf);color:var(--ink)}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.no{color:var(--er);border-color:var(--er)}
.seg{display:flex;gap:6px;margin:14px 0}
.seg button{flex:1;padding:9px 4px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:8px}
.seg button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.login{margin-top:9vh}
.mut{color:var(--mut)}.small{font-size:.88rem}.er{color:var(--er);min-height:1.4em;margin:6px 0}
.msg{margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--ln)}
ul{padding-left:20px;margin:0 0 8px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;display:inline-flex;align-items:center;justify-content:center;background:var(--ln);color:var(--ink);font-weight:700;font-size:.8rem;vertical-align:middle;margin-right:8px}
.av.big{width:84px;height:84px;border-radius:10px;font-size:1.4rem;margin:0 14px 0 0}
.bh{display:flex;align-items:center;margin-bottom:12px}
.up{display:inline-block;margin:0;padding:6px 10px;font-weight:400;font-size:.9rem;cursor:pointer;border:1px solid var(--ln);border-radius:8px}
.ph{display:flex;gap:8px;align-items:center}
.pre{padding:9px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);margin-top:5px;font-weight:400}
label select{margin-top:5px;font-weight:400}
.res{margin:14px 0 0}
.verd{font-weight:700;font-size:1.1rem;color:var(--ok)}
.verd.no{color:var(--er)}
code{font-family:ui-monospace,monospace;font-size:.88rem}
.row{flex-wrap:wrap}
.clk{cursor:pointer}

  else{data=e.t+'\n'+e.k+' · '+e.c+'\n\n(Épreuve de démonstration)';fn=e.t.replace(/[^\wÀ-ÿ -]/g,'')+'.txt'}

async function addE(){const t=$('#et').value.trim(),f=$('#ef').files[0],m=$('#ee');m.textContent='';
 if(!t){m.textContent='Saisissez un titre.';return}

 const id=Date.now(),e={id,t,c:$('#ec').value,k:$('#ek').value};
 if(f){if(!DB){m.textContent='Enregistrement indisponible ici.';return}
  const u=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
  try{await DB.doc('epreuves/'+id).set({n:f.name,u})}catch(x){m.textContent='Impossible d’enregistrer le fichier.';return}

 EP.push(e);save();draw()}
